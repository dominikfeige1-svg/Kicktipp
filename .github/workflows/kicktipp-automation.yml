print(f"  📅 Morgen ({tomorrow.date()}): {len(matches_tomorrow)} Spiele")

if not matches_tomorrow:
    print("\n  ℹ️  Keine Spiele morgen. Script beendet.")
    sys.exit(0)

# =====================================================
# SCHRITT 2: DATENSAMMLUNG
# =====================================================

print("\n[2/4] 📊 Sammle Daten...")

for match in matches_tomorrow:
