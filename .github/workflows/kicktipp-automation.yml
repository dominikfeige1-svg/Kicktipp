name: Kicktipp Master Automation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
      - run: |
          pip install selenium webdriver-manager python-dotenv
      - env:
          KICKTIPP_EMAIL: ${{ secrets.KICKTIPP_EMAIL }}
          KICKTIPP_PASSWORD: ${{ secrets.KICKTIPP_PASSWORD }}
        run: |
          echo "KICKTIPP_EMAIL=$KICKTIPP_EMAIL" > .env
          echo "KICKTIPP_PASSWORD=$KICKTIPP_PASSWORD" >> .env
          python master_automation_v4.py
      - run: |
          git config user.email "bot@kicktipp.de"
          git config user.name "Kicktipp Bot"
          git add -A
          git commit -m "Auto-update" || true
          git push
